version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bhusentry-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - HOST=0.0.0.0
      - PORT=8000
    networks:
      - bhusentry-net

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: bhusentry-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "3000:80"
    depends_on:
      - backend
    networks:
      - bhusentry-net

networks:
  bhusentry-net:
    driver: bridge
